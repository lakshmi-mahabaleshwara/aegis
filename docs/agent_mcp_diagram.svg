<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel { rx: 14; }
      .title { fill: #e8eef7; font-weight: 700; }
      .sub   { fill: #aeb9c9; }
      .chip  { fill: #cdd6e3; }
      .muted { fill: #6f7d95; }
      .edge  { stroke: #4a5670; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6a88"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="760" height="620" fill="#0b1120"/>

  <!-- heading -->
  <text x="380" y="40" text-anchor="middle" class="title" font-size="21">Aegis — Agent Skill &amp; MCP Server</text>
  <text x="380" y="62" text-anchor="middle" class="sub" font-size="12.5">Two agent-facing surfaces over one pipeline · no PHI crosses into the model context</text>

  <!-- ============ Skill surface (left) ============ -->
  <rect x="40" y="88" width="330" height="188" rx="14" fill="#0f2018" stroke="#2f9e6b" stroke-width="1.6"/>
  <text x="205" y="116" text-anchor="middle" class="title" font-size="16">Agent Skill · aegis-deid</text>
  <text x="205" y="136" text-anchor="middle" class="sub" font-size="11.5">Claude Code plugin / any agent harness</text>

  <rect x="60" y="150" width="290" height="46" rx="9" fill="#12281d" stroke="#2a5f45" stroke-width="1.2"/>
  <text x="205" y="170" text-anchor="middle" class="chip" font-size="12.5" font-weight="600">Console commands (stdout JSON)</text>
  <text x="205" y="187" text-anchor="middle" class="sub" font-size="11">aegis-deidentify · aegis-verify · aegis-fixture</text>

  <rect x="60" y="206" width="290" height="52" rx="9" fill="#12281d" stroke="#2a5f45" stroke-width="1.2"/>
  <text x="205" y="226" text-anchor="middle" class="chip" font-size="12.5" font-weight="600">Returns</text>
  <text x="205" y="244" text-anchor="middle" class="sub" font-size="11">PHI-free envelope · exit codes 0/1/2/3/4</text>

  <!-- ============ MCP surface (right) ============ -->
  <rect x="390" y="88" width="330" height="188" rx="14" fill="#0e1a2b" stroke="#3b74c4" stroke-width="1.6"/>
  <text x="555" y="116" text-anchor="middle" class="title" font-size="16">MCP Server · aegis-mcp</text>
  <text x="555" y="136" text-anchor="middle" class="sub" font-size="11.5">Claude Desktop / Inspector / Open WebUI (stdio)</text>

  <rect x="410" y="150" width="290" height="70" rx="9" fill="#12233a" stroke="#2f5488" stroke-width="1.2"/>
  <text x="555" y="169" text-anchor="middle" class="chip" font-size="12.5" font-weight="600">6 MCP tools</text>
  <text x="555" y="187" text-anchor="middle" class="sub" font-size="10.7">warm_up · deidentify_file · start_batch_job</text>
  <text x="555" y="203" text-anchor="middle" class="sub" font-size="10.7">get_job_status · summarize_run · list_review_queue</text>

  <rect x="410" y="230" width="290" height="28" rx="9" fill="#12233a" stroke="#2f5488" stroke-width="1.2"/>
  <text x="555" y="248" text-anchor="middle" class="sub" font-size="11">PHI-free responses (names · counts · states)</text>

  <!-- ============ PHI-free boundary ============ -->
  <line x1="40" y1="300" x2="720" y2="300" stroke="#c9922f" stroke-width="1.4" stroke-dasharray="7 6"/>
  <rect x="300" y="288" width="160" height="24" rx="12" fill="#241c0c" stroke="#c9922f" stroke-width="1.2"/>
  <text x="380" y="304" text-anchor="middle" fill="#e8c579" font-size="11.5" font-weight="600">PHI-free boundary</text>

  <!-- arrows into core -->
  <path class="edge" d="M205,276 L205,336" marker-end="url(#arrow)"/>
  <path class="edge" d="M555,276 L555,336" marker-end="url(#arrow)"/>

  <!-- ============ Pipeline core ============ -->
  <rect x="40" y="338" width="680" height="150" rx="14" fill="#0d1b22" stroke="#2f8f9e" stroke-width="1.6"/>
  <text x="380" y="366" text-anchor="middle" class="title" font-size="16">Aegis Pipeline Core</text>
  <text x="380" y="385" text-anchor="middle" class="sub" font-size="11.5">deidentify() facade · dicom_runner / image_runner</text>

  <rect x="62" y="398" width="205" height="72" rx="9" fill="#102730" stroke="#276874" stroke-width="1.2"/>
  <text x="164" y="420" text-anchor="middle" class="chip" font-size="12.5" font-weight="600">Pixel Redaction</text>
  <text x="164" y="438" text-anchor="middle" class="sub" font-size="11">OCR + NER classification</text>
  <text x="164" y="454" text-anchor="middle" class="sub" font-size="11">union-mask across frames</text>

  <rect x="277" y="398" width="206" height="72" rx="9" fill="#102730" stroke="#276874" stroke-width="1.2"/>
  <text x="380" y="420" text-anchor="middle" class="chip" font-size="12.5" font-weight="600">Metadata Scrub</text>
  <text x="380" y="438" text-anchor="middle" class="sub" font-size="11">PII tokenize · UID-graph remap</text>
  <text x="380" y="454" text-anchor="middle" class="sub" font-size="11">private tags removed</text>

  <rect x="493" y="398" width="205" height="72" rx="9" fill="#102730" stroke="#276874" stroke-width="1.2"/>
  <text x="595" y="420" text-anchor="middle" class="chip" font-size="12.5" font-weight="600">PS3.15 Attestation</text>
  <text x="595" y="438" text-anchor="middle" class="sub" font-size="11">PatientIdentityRemoved=YES</text>
  <text x="595" y="454" text-anchor="middle" class="sub" font-size="11">BurnedInAnnotation=NO</text>

  <!-- arrow to outputs -->
  <path class="edge" d="M380,488 L380,520" marker-end="url(#arrow)"/>

  <!-- ============ Outputs ============ -->
  <rect x="40" y="522" width="680" height="72" rx="14" fill="#0f1626" stroke="#3a4666" stroke-width="1.6"/>
  <text x="380" y="548" text-anchor="middle" class="title" font-size="15">Outputs (local staging)</text>
  <text x="380" y="570" text-anchor="middle" class="sub" font-size="11.5">De-identified DICOM / images · PHI-free ground-truth CSVs · quarantine for manual review</text>
  <text x="380" y="586" text-anchor="middle" class="muted" font-size="10.5" fill="#6f7d95">staging_output/ · staging_not_processed/</text>
</svg>
