[project]
name = "aegis"
version = "1.0.0"
description = "A configurable pipeline for anonymization and preprocessing of medical imaging datasets (DICOM, JPEG/PNG) for AI training."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = "Apache License"
readme = "README.md"
requires-python = ">=3.10,<3.14.1 || >3.14.1,<4.0"
dependencies = [
    "monai (>=1.6.0,<2.0.0)",
    "pydicom (>=3.0.2,<4.0.0)",
    "easyocr (>=1.7.2,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "transformers (>=5.14.1,<6.0.0)",
    "mcp[cli] (>=1.28.1,<2.0.0)"
]

[project.optional-dependencies]
vlm = [
    "timm (>=0.9.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
