paths:
  input_dir: '${AEGIS_INPUT_DIR:staging_input}'
  output_dir: '${AEGIS_OUTPUT_DIR:staging_output}'
  not_processed_dir: '${AEGIS_REVIEW_DIR:staging_not_processed}'
  dicom_folder: 'dicom'
  image_folder: 'image'
  timestamp_format: '%Y-%m-%d_%H-%M'

runtime:
  dataloader_num_workers: 0

reporting:
  # When true (default), Aegis writes its own "ground truth" of what it
  # detected/redacted to CSV files in the run output directory:
  #   - aegis_pixel_detections.csv : one row per OCR region (burnt-in PHI)
  #   - aegis_tag_actions.csv      : one row per scrubbed DICOM header tag
  # When false, no CSVs are written — consume the per-file
  # records from the pipeline data dict and store them in your own database.
  save_ground_truth: true
  # aegis_pixel_detections.csv is PHI-free by default: detected text is
  # written as a salted token (text_token, same salt as header DUMMY
  # tokens) plus its length — never verbatim. To validate against ground
  # truth, tokenize the ground-truth strings with the same salt and join
  # on the token.
  #
  # include_phi_text: true ADDITIONALLY writes
  # aegis_pixel_detections_PHI.csv with the verbatim OCR text — raw PHI,
  # for validation only. It is only ever written to phi_report_dir, which
  # must be set and must differ from the run output directory, so the
  # de-identified output tree stays shippable as-is.
  include_phi_text: '${AEGIS_INCLUDE_PHI_TEXT:false}'
  phi_report_dir: '${AEGIS_PHI_REPORT_DIR:}'

storage:
  protocol: '${AEGIS_STORAGE_PROTOCOL:file}'   # file, s3, gs, az, memory
  options: {}                                    # fsspec kwargs (key, secret, endpoint_url, etc.)

tokenization:
  salt: '${AEGIS_TOKEN_SALT:}'                   # Secret salt for deterministic hashing
                                                  # Set via env var or secrets manager
                                                  # or override in config overlay
                                                  # Empty = use built-in default (not for production)

series:
  enabled: true
  accepted_modalities: ['CT', 'MR', 'US', 'CR', 'DX', 'MG', 'PT', 'XA', 'RF', 'OT']
  output_structure: 'hierarchical'  # 'hierarchical' = StudyUID/SeriesUID/

  # Adaptive keyframe sampling for volume PHI redaction (replaces keyframe_count)
  keyframe_sampling:
    sample_pct: 0.10    # scan 10% of frames
    floor: 3            # minimum keyframes regardless of series length
    ceiling: 25         # maximum keyframes regardless of series length
    # Examples: T=5→5, T=30→3, T=100→10, T=300→25(capped)

us_regions:
  enabled: true                # Enable US fan-geometry scoped OCR
  zero_outside_regions: true   # Zero diagnostic pixels before OCR

ocr:
  decoder: 'beamsearch'
  beam_width: 5
  confidence_threshold: 0.4
  languages: ['en']
  gpu_usage: false
  # Air-gapped deployment: point at a pre-bundled EasyOCR weights directory
  # (populate with scripts/prefetch_models.py). Empty = EasyOCR default (~/.EasyOCR).
  model_storage_directory: '${AEGIS_OCR_MODEL_DIR:}'
  # Set false to guarantee EasyOCR never touches the network (weights must
  # already exist in model_storage_directory or the default cache).
  download_enabled: '${AEGIS_MODEL_DOWNLOADS:true}'

ner:
  enabled: true
  model_name: 'StanfordAIMI/stanford-deidentifier-base'
  # Exact commit of the model repo on HuggingFace — pinned so the model
  # cannot silently change under a deployment. Bump deliberately, with
  # re-validation. Empty = float on the repo's default branch (not recommended).
  model_revision: '661b9c1c717d3165512d440abc3700c386aefab6'
  # Air-gapped deployment: true = resolve the model from the local
  # HuggingFace cache only, zero network calls (even update checks).
  # Prefetch with scripts/prefetch_models.py first.
  local_files_only: '${AEGIS_HF_OFFLINE:false}'
  device: '${AEGIS_DEVICE:cpu}'  # options: 'cpu', 'cuda', 'mps'

  # NER entity types treated as PHI (text matching these → redacted)
  phi_labels:
    - PATIENT
    - DOCTOR
    - USERNAME
    - IDNUM
    - MEDICALRECORD
    - HOSPITAL
    - DATE
    - AGE
    - PHONE
    - FAX
    - EMAIL
    - URL
    - SSN
    - ACCOUNT
    - LICENSE
    - STREET
    - CITY
    - STATE
    - ZIP
    - COUNTRY
    - ORGANIZATION
    - PROFESSION

  # Known clinical/technical terms that should NEVER be redacted
  clinical_allowlist:
    # Device manufacturers
    - mindray
    - ge
    - philips
    - siemens
    - toshiba
    - canon
    - samsung
    - hitachi
    - esaote
    - fujifilm
    - hologic
    - zonare
    # Imaging modes
    - adult abd
    - adult abd n
    - ob
    - gyn
    - cardiac
    - vascular
    - msk
    - small parts
    - b
    - m

  # Regex patterns for known clinical/technical text (preserved)
  clinical_patterns:
    - '^[A-Z]{1,3}\d[\w.-]*$'                          # Probe IDs: SC5-1N, C5-2
    - '(?i)^Consona\s+\w+$'                             # Device models: Consona N9
    - '^(F\s*H?\d|D\s+\d|G\s+\d|FR\s+\d|DR\s+\d)'     # Ultrasound params
    - '^(AP|MI|TIS|SSI)\s+\d'                           # Acoustic/thermal indices
    - '(?i)^(iClear|iBeam|iTouch)\s+\d'                 # Image processing
    - '^Z\s+\d+\.\d+$'                                  # Z parameter
    - '^\d+\.\d+$'                                      # Standalone decimals
    - '^\d+\.?\d*\s*(cm|mm|MHz)$'                       # Measurements
    - '(?i)^(Adult|Pediatric)\s+(ABD|OB|GYN|CARD)'      # Exam types

  # Heuristic regex patterns for PHI in short OCR fragments (redacted)
  phi_heuristic_patterns:
    - '^\d{8}[-/]\d{6}[-/]?\w*$'                        # Date-ID combos: 20260117-091825-6AAA
    - '^\d{1,2}[-/]\d{1,2}[-/]\d{2,4}(\s+\d{1,2}[:.]\d{2}.*)?$'   # Dates: 17-01-2026
    - '^\d{4}[-/]\d{1,2}[-/]\d{1,2}(\s+\d{1,2}[:.]\d{2}.*)?$'     # Dates: 2026/01/17
    - '(?i)(hospital|clinic|centre|center|diagnostic|medical|health|labs?|imaging|radiology|pathology|institute|university|foundation)'
    - '(?i)^Dr\.?\s+'                                   # Doctor names
    - '(?i)^(MRN?|ID|PT)\s*[:#]?\s*\d+'                 # Patient ID patterns

# Safelist is used as fallback when ner.enabled is false
safelist:
  # Basic anatomical markers
  - '^m$'
  - '^R$'
  - '^L$'
  - '^B$'  # B-mode ultrasound
  
  # Ultrasound technical parameters (preserve clinical data)
  - '^F\s*H?\d+\.?\d*$'  # Frequency: F H5.0, FH5.0, F 5.0
  - '^D\s*\d+\.?\d*$'    # Depth: D 13.0, D13.0
  - '^G\s*\d+$'          # Gain: G 25, G25
  - '^6\s*\d+$'          # Gain OCR error: 6 25 (G misread as 6)
  - '^FR\s*\d+$'         # Frame Rate: FR 25, FR25
  - '^DR\s*\d+$'         # Dynamic Range: DR 130, DR130
  - '^Z\s*\d+\.\d+$'     # Z parameter: Z 1.10, Z1.10
  - '^\d+\.\d+$'         # Standalone decimals: 1.10, 21.10 (for misread Z params)
  - '^AP\s+\d+\.\d+%'    # Acoustic Power: AP 81.28%
  - '^MI\s+\d+\.\d+'     # Mechanical Index: MI 1.14
  - '^TIS\s+\d+\.\d+'    # Thermal Index: TIS 0.3
  - '^SSI\s+\d+$'        # SSI parameter: SSI 1540
  
  # Ultrasound modes and settings
  - '^iClear\s+\d+$'     # Image enhancement: iClear 5
  - '^iBeam\s+\d+$'      # Beam forming: iBeam 2
  
  # Measurement markers (cm, mm, etc.)
  - '\d+\.?\d*\s*(cm|mm|MHz)$'
  
  # Generic medical terms (case-insensitive)
  - '(?i)patient'
  - '(?i)hospital'

# Instance/Study/Series/FrameOfReference UIDs are NOT listed here: they are
# replaced (PS3.15 action U) by the scrubber's deterministic UID remap, which
# rewrites every patient-linkable UID to a new, internally consistent value
# while preserving SOP-Class / Transfer-Syntax UIDs. Do not add them here as
# REMOVE/DUMMY — dropping or tokenizing a required UID corrupts the object.
pii_mapping:
  '(0010,0010)': 'DUMMY'   # PatientName
  '(0010,0020)': 'DUMMY'   # PatientID
  '(0010,0030)': 'REMOVE'  # PatientBirthDate
  '(0008,0020)': 'ZERO'    # StudyDate
  '(0008,0050)': 'REMOVE'  # AccessionNumber
  '(0008,0090)': 'DUMMY'   # ReferringPhysicianName
  '(0008,0080)': 'REMOVE'  # InstitutionName
  '(0010,0040)': 'REMOVE'  # PatientSex
  '(0010,1010)': 'REMOVE'  # PatientAge
  '(0010,1020)': 'REMOVE'  # PatientSize
  '(0010,1030)': 'REMOVE'  # PatientWeight
  '(0008,0081)': 'REMOVE'  # InstitutionAddress
  '(0008,1040)': 'REMOVE'  # InstitutionalDeptName
  '(0008,1048)': 'REMOVE'  # PhysiciansOfRecord
  '(0008,1050)': 'REMOVE'  # PerformingPhysicianName
  '(0008,1030)': 'REMOVE'  # StudyDescription
  '(0008,103E)': 'REMOVE'  # SeriesDescription
  '(0008,0021)': 'ZERO'    # SeriesDate
  '(0008,0023)': 'ZERO'    # ContentDate
  '(0008,0030)': 'ZERO'    # StudyTime
  '(0008,0031)': 'ZERO'    # SeriesTime
  '(0020,0010)': 'DUMMY'   # StudyID
  '(0010,21B0)': 'REMOVE'  # AdditionalPatientHistory
  '(0040,A124)': 'REMOVE'  # UID in SR content
  '(0010,2297)': 'REMOVE'  # ResponsiblePerson
