[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monai-aegis"
version = "0.1.0"
description = "MONAI-based medical image de-identification pipeline with OCR and metadata scrubbing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aegis Team"},
]
keywords = ["monai", "medical-imaging", "de-identification", "dicom", "phi", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "monai>=1.0.0",
    "torch>=1.13.0",
    "pydicom>=2.3.0",
    "easyocr>=1.6.0",
    "opencv-python>=4.7.0",
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "transformers>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
aegis-pipeline = "run_pipeline:main"

[project.urls]
Homepage = "https://github.com/aegis-team/monai-aegis"
Documentation = "https://github.com/aegis-team/monai-aegis#readme"
Repository = "https://github.com/aegis-team/monai-aegis"
Issues = "https://github.com/aegis-team/monai-aegis/issues"

[tool.setuptools]
packages = ["monai_aegis", "monai_aegis.transforms", "monai_aegis.config"]

[tool.setuptools.package-dir]
monai_aegis = "."
monai_aegis.transforms = "transforms"
monai_aegis.config = "config"

[tool.setuptools.package-data]
"monai_aegis.config" = ["*.yaml"]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
